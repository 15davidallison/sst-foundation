# Operations on a deployed stage, triggered by hand or by a deployment console (workflow_dispatch in the app repo):
#   redeploy  - deploy the commit the stage is running now, then smoke
#   rollback  - deploy an earlier commit that had a successful deployment on this stage, then smoke
#   teardown  - sst remove the stage. Production is protected: this job alone sets SST_FOUNDATION_TEARDOWN=<app>/production
#               (foundationApp lifts `protect`, keeps `removal: retain`), so stateful resources (buckets, tables) are kept.
#
# Call it from the app's own workflow, pinned to a sst-foundation tag (see docs/usage.md, "Operations"):
#
#   on:
#     workflow_dispatch:
#       inputs: { action: ..., stage: ..., sha: ..., requested-by: ... }
#   jobs:
#     ops:
#       uses: 15davidallison/sst-foundation/.github/workflows/app-ops.yml@v0.5.0
#       permissions: { contents: read, id-token: write, deployments: write }
#       with: { action: ..., stage: ..., sha: ..., requested-by: ..., role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }} }
#       secrets: { nonprod-token: ${{ secrets.NONPROD_GATE_TOKEN }} }
#
# Roles and trust are the ones app-ci.yml uses: dispatched from `main`, the non-prod job's OIDC subject is
# `...:ref:refs/heads/main` and the production job's is `...:environment:production` (deployment branches = main).
# Concurrency groups match app-ci.yml's, so an operation never overlaps a deploy of the same stage.
name: app-ops

on:
  workflow_call:
    inputs:
      action:
        description: redeploy | rollback | teardown
        type: string
        required: true
      stage:
        description: production, staging, dev-<name> or pr-<n>
        type: string
        required: true
      sha:
        description: Rollback target (full 40-character commit). Must have a successful deployment on this stage.
        type: string
        default: ""
      requested-by:
        description: Who asked (a console passes the signed-in GitHub login); shown in the run summary
        type: string
        default: ""
      role-arn:
        description: Non-prod deploy role (production uses the environment variable AWS_DEPLOY_ROLE_ARN_PRODUCTION)
        type: string
        required: true
      production-stage:
        type: string
        default: production
      app-name:
        description: App name (as in sst.config.ts); used for the production teardown override and deployment records. Empty = repository name.
        type: string
        default: ""
      aws-region:
        type: string
        default: us-west-2
      node-version:
        type: string
        default: "24"
      site-url-output:
        type: string
        default: url
      smoke-url-output:
        type: string
        default: url
      smoke-expect-jq:
        type: string
        default: ""
    secrets:
      nonprod-token:
        required: false

permissions:
  contents: read

jobs:
  # Validates the request and resolves the commit before anything assumes a role.
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: read
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      target: ${{ steps.plan.outputs.target }}
    env:
      ACTION: ${{ inputs.action }}
      STAGE: ${{ inputs.stage }}
      SHA: ${{ inputs.sha }}
      PRODUCTION_STAGE: ${{ inputs.production-stage }}
      REQUESTED_BY: ${{ inputs.requested-by }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate and resolve
        id: plan
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Run operations from main (got $GITHUB_REF)"; exit 1; }
          case "$ACTION" in redeploy|rollback|teardown) ;; *) echo "::error::Unknown action '$ACTION'"; exit 1;; esac
          [[ "$STAGE" =~ ^(production|staging|dev-[a-z0-9-]+|pr-[1-9][0-9]*)$ ]] || { echo "::error::Bad stage '$STAGE'"; exit 1; }
          target=nonprod; [ "$STAGE" = "$PRODUCTION_STAGE" ] && target=production

          # Commits that had a successful sst-foundation deployment on this stage, newest first. "Successful" = a
          # `success` anywhere in its status history (teardown later marks every deployment `inactive`, failed ones too).
          ok=""
          while IFS=$'\t' read -r id sha; do
            [ -n "$id" ] || continue
            if gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq '[.[].state] | index("success") != null' | grep -q true; then
              ok+="$sha"$'\n'
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$STAGE&per_page=100" --jq '.[] | select(.payload.sstFoundation == 1) | [.id, .sha] | @tsv')
          ref=""
          case "$ACTION" in
            redeploy)
              ref=$(printf '%s' "$ok" | head -n 1)
              [ -n "$ref" ] || { echo "::error::No successful deployment of $STAGE to redeploy"; exit 1; } ;;
            rollback)
              [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::rollback needs the full 40-character sha"; exit 1; }
              grep -qx "$SHA" <<< "$ok" || { echo "::error::$SHA never deployed successfully to $STAGE; refusing to roll back to it"; exit 1; }
              ref=$SHA ;;
            teardown) ref=$GITHUB_SHA ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          { echo "### $ACTION $STAGE"; echo; echo "Commit: \`${ref:0:7}\` · requested by: ${REQUESTED_BY:-unknown} · role: $target"; } >> "$GITHUB_STEP_SUMMARY"

  nonprod:
    needs: plan
    if: needs.plan.outputs.target == 'nonprod'
    runs-on: ubuntu-24.04
    permissions: &op-permissions
      id-token: write
      contents: read
      deployments: write
    concurrency:
      group: deploy-${{ inputs.stage }}
      cancel-in-progress: false
    env:
      ACTION: ${{ inputs.action }}
      STAGE: ${{ inputs.stage }}
      APP_NAME: ${{ inputs.app-name || github.event.repository.name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - &setup
        uses: $/.github/actions/setup
        with:
          ref: ${{ needs.plan.outputs.ref }}
          node-version: ${{ inputs.node-version }}
      - uses: $/.github/actions/aws-login
        with:
          role-arn: ${{ inputs.role-arn }}
          session-name: sst-foundation-ops
          region: ${{ inputs.aws-region }}
      # Start record (in_progress; action = redeploy | rollback | teardown) so consoles show it while it runs.
      - &record-start
        id: record-start
        uses: $/.github/actions/record-start
        with:
          action: ${{ inputs.action }}
          app-name: ${{ inputs.app-name || github.event.repository.name }}
          stage: ${{ inputs.stage }}
          region: ${{ inputs.aws-region }}
          sha: ${{ needs.plan.outputs.ref }}
      - &deploy
        id: deploy
        if: inputs.action != 'teardown'
        uses: $/.github/actions/sst-deploy
        with:
          stage: ${{ inputs.stage }}
          url-output: ${{ inputs.smoke-url-output }}
          site-url-output: ${{ inputs.site-url-output }}
      - &remove
        name: Remove stage
        id: remove
        if: inputs.action == 'teardown'
        env:
          DEPLOYMENT_ID: ${{ steps.record-start.outputs.id }}
        run: |
          set -euo pipefail
          npx sst remove --stage "$STAGE"
          if [[ "$STAGE" =~ ^pr- ]]; then
            # same as preview-cleanup.yml: drop the empty state object sst remove leaves behind
            bucket=$(aws ssm get-parameter --name /sst/bootstrap --query Parameter.Value --output text | jq -r '.state')
            aws s3 rm "s3://$bucket/app/$APP_NAME/$STAGE.json" || true
          fi
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$STAGE&per_page=100" --jq '.[].id'); do
            [ "$id" = "${DEPLOYMENT_ID:-}" ] && continue # our own teardown record gets its final status from the record step
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive > /dev/null || echo "::warning::Couldn't mark deployment $id inactive"
          done
      - name: Record GitHub deployment
        if: always() && (inputs.action == 'teardown' && steps.remove.outcome || steps.deploy.outcome) != 'skipped' && (inputs.action == 'teardown' && steps.remove.outcome || steps.deploy.outcome) != ''
        uses: $/.github/actions/record-outcome
        with:
          outcome: ${{ inputs.action == 'teardown' && steps.remove.outcome || steps.deploy.outcome }}
          deployment-id: ${{ steps.record-start.outputs.id }}
          action: ${{ inputs.action }}
          app-name: ${{ inputs.app-name || github.event.repository.name }}
          stage: ${{ inputs.stage }}
          region: ${{ inputs.aws-region }}
          sha: ${{ needs.plan.outputs.ref }}
          site-url-output: ${{ inputs.site-url-output }}
      - uses: $/.github/actions/smoke
        if: inputs.action != 'teardown'
        with:
          url: ${{ steps.deploy.outputs.url }}
          stage: ${{ inputs.stage }}
          expect-jq: ${{ inputs.smoke-expect-jq }}
          nonprod-token: ${{ secrets.nonprod-token }}

  production:
    needs: plan
    if: needs.plan.outputs.target == 'production'
    runs-on: ubuntu-24.04
    environment:
      name: production # the production role trusts only this environment; deployment branches = main
    permissions: *op-permissions
    outputs:
      outcome: ${{ inputs.action == 'teardown' && steps.remove.outcome || steps.deploy.outcome }}
      record-id: ${{ steps.record-start.outputs.id }}
      account: ${{ steps.facts.outputs.account }}
      site: ${{ steps.deploy.outputs.site }}
    concurrency:
      group: deploy-${{ inputs.production-stage }}
      cancel-in-progress: false
    env:
      # Same as the nonprod job's env (GitHub Actions doesn't support YAML merge keys), plus the production-only values.
      ACTION: ${{ inputs.action }}
      STAGE: ${{ inputs.stage }}
      APP_NAME: ${{ inputs.app-name || github.event.repository.name }}
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN_PRODUCTION }}
      # Read by foundationApp: lifts `protect` for this app's production only (removal stays `retain`). Teardown only.
      SST_FOUNDATION_TEARDOWN: ${{ inputs.action == 'teardown' && format('{0}/production', inputs.app-name || github.event.repository.name) || '' }}
    steps:
      - name: Require production role variable
        run: |
          test -n "$PRODUCTION_ROLE_ARN" || { echo "::error::Environment variable AWS_DEPLOY_ROLE_ARN_PRODUCTION is not set on the 'production' environment"; exit 1; }
      - *setup
      - uses: $/.github/actions/aws-login
        with:
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PRODUCTION }}
          session-name: sst-foundation-ops-production
          region: ${{ inputs.aws-region }}
      - *record-start
      - *deploy
      - *remove
      # Production's job declares `environment:`, so GitHub keeps its own deployment for it and marks it finished when the
      # job ends, which retires every older deployment of the environment, including one recorded here. So this job only
      # collects the facts, and record-production (a later job) records the deployment.
      - name: Collect deployment facts
        id: facts
        if: always() && (inputs.action == 'teardown' && steps.remove.outcome || steps.deploy.outcome) != 'skipped' && (inputs.action == 'teardown' && steps.remove.outcome || steps.deploy.outcome) != ''
        run: echo "account=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/smoke
        if: inputs.action != 'teardown'
        with:
          url: ${{ steps.deploy.outputs.url }}
          stage: ${{ inputs.stage }}
          expect-jq: ${{ inputs.smoke-expect-jq }}

  # See app-ci.yml: GitHub's own deployment for the `environment: production` job would retire a record made inside it.
  record-production:
    needs: [plan, production]
    if: always() && needs.production.result != 'skipped' && needs.production.outputs.outcome != ''
    runs-on: ubuntu-24.04
    permissions:
      deployments: write
    steps:
      - uses: $/.github/actions/record-outcome
        with:
          outcome: ${{ needs.production.outputs.outcome }}
          deployment-id: ${{ needs.production.outputs.record-id }}
          action: ${{ inputs.action }}
          app-name: ${{ inputs.app-name || github.event.repository.name }}
          stage: ${{ inputs.stage }}
          region: ${{ inputs.aws-region }}
          sha: ${{ needs.plan.outputs.ref }}
          account: ${{ needs.production.outputs.account }}
          site: ${{ needs.production.outputs.site }}
