# Default CI/CD for sst-foundation apps. Call it from the app's own workflow, pinned to a sst-foundation tag:
#
#   jobs:
#     ci:
#       uses: 15davidallison/sst-foundation/.github/workflows/app-ci.yml@v0.3.0
#       permissions: { contents: read, id-token: write }   # id-token is needed for the OIDC deploy
#       with:
#         deploy-stage: staging
#         role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
#         production-stage: production   # optional: adds the production steps below
#
# Pipeline on push to main:  checks -> deploy (deploy-stage) -> smoke -> deploy-production -> smoke-production
# A failed smoke job stops the run, so production is never attempted. Without `production-stage` only the first
# three jobs run. Pull requests run `checks` only. AWS access is GitHub OIDC only; no stored keys.
#
# Roles: `deploy` uses `role-arn` (non-prod role; its job declares no GitHub environment, so its OIDC subject is
# the main-branch one). `deploy-production` declares `environment: production`, so its subject is
# `...:environment:production`, and it reads the role from the environment variable
# AWS_DEPLOY_ROLE_ARN_PRODUCTION (environment variables are visible only to a job that names the environment,
# so the caller cannot pass it in). Smoke jobs get no AWS credentials at all.
# Customize by: (1) inputs below, (2) adding your own jobs next to the `ci` job (use `needs: ci`), or (3) not
# calling this at all.
name: app-ci

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      sst-install:
        description: Run `npx sst install` before checks (needed when sst.config.ts exists)
        type: boolean
        default: true
      lint-command:
        type: string
        default: npm run lint
      typecheck-command:
        type: string
        default: npm run typecheck
      test-command:
        description: Empty = skip tests
        type: string
        default: ""
      deploy-stage:
        description: Stage deployed on push to main (production, staging, ...)
        type: string
        required: true
      role-arn:
        description: OIDC deploy role to assume. Empty = checks only, no deploy.
        type: string
        default: ""
      aws-region:
        type: string
        default: us-west-2
      smoke-url-output:
        description: Key in .sst/outputs.json holding the URL to smoke check. Empty = skip.
        type: string
        default: url
      smoke-expect-jq:
        description: Optional jq expression the JSON response body must satisfy
        type: string
        default: ""
      smoke-command:
        description: Optional extra smoke test, run after the built-in URL check with SMOKE_URL and SMOKE_STAGE set (e.g. `npm run smoke`)
        type: string
        default: ""
      production-stage:
        description: Stage deployed after staging passes its smoke tests (normally `production`). Empty = no production job.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  checks:
    # Values shared by both jobs are defined once here (&anchor) and reused below (*alias).
    runs-on: &runner ubuntu-24.04 # pinned: ubuntu-latest moves; bump deliberately
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - &install
        run: npm ci
      # Generates .sst/platform (gitignored), which sst.config.ts references. No AWS access needed.
      - name: SST install
        if: inputs.sst-install
        # Needs an explicit stage: SST's default (your username) is rejected by foundationApp.
        env:
          STAGE: ${{ inputs.deploy-stage }}
        run: npx sst install --stage "$STAGE"
      - name: Lint
        run: ${{ inputs.lint-command }}
      - name: Typecheck
        run: ${{ inputs.typecheck-command }}
      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.role-arn != ''
    runs-on: *runner
    permissions:
      id-token: write # request the OIDC token
      contents: read
    concurrency:
      group: deploy-${{ inputs.deploy-stage }}
      cancel-in-progress: false # never interrupt a deploy half-way
    outputs:
      url: ${{ steps.url.outputs.url }}
    env:
      STAGE: ${{ inputs.deploy-stage }}
      SMOKE_URL_OUTPUT: ${{ inputs.smoke-url-output }}
    steps:
      - *checkout
      - *setup-node
      - *install
      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-arn }}
          role-session-name: sst-foundation-deploy
          aws-region: ${{ inputs.aws-region }}
      - name: Deploy
        run: npx sst deploy --stage "$STAGE"
      - &read-url
        name: Read URL for smoke tests
        id: url
        run: |
          URL=""
          if [ -n "$SMOKE_URL_OUTPUT" ]; then URL=$(jq -r --arg k "$SMOKE_URL_OUTPUT" '.[$k] // empty' .sst/outputs.json); fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  # Runs with no AWS credentials. Always runs after a deploy (steps skip inside), so `needs` below never
  # sees a skipped job.
  smoke:
    needs: deploy
    runs-on: *runner
    permissions:
      contents: read
    env: &smoke-env
      SMOKE_EXPECT_JQ: ${{ inputs.smoke-expect-jq }}
      SMOKE_COMMAND: ${{ inputs.smoke-command }}
    steps:
      - *checkout
      - *setup-node
      - *install
      - name: Smoke check
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.url }}
        run: |
          if [ -z "$SMOKE_URL" ]; then echo "No smoke URL configured; skipping"; exit 0; fi
          code=$(curl -sS -o body.json -w '%{http_code}' --retry 5 --retry-delay 3 --retry-all-errors "$SMOKE_URL")
          echo "HTTP $code"
          test "$code" = "200"
          if [ -n "$SMOKE_EXPECT_JQ" ]; then jq -e "$SMOKE_EXPECT_JQ" body.json > /dev/null; fi
      - name: Smoke command
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.url }}
          SMOKE_STAGE: ${{ inputs.deploy-stage }}
        run: |
          if [ -z "$SMOKE_COMMAND" ]; then exit 0; fi
          bash -c "$SMOKE_COMMAND"

  deploy-production:
    needs: [deploy, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.production-stage != ''
    runs-on: *runner
    environment:
      name: production # the production role's trust accepts only this environment; deployment branches = main
      url: ${{ steps.url.outputs.url }}
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-${{ inputs.production-stage }}
      cancel-in-progress: false
    outputs:
      url: ${{ steps.url.outputs.url }}
    env:
      STAGE: ${{ inputs.production-stage }}
      SMOKE_URL_OUTPUT: ${{ inputs.smoke-url-output }}
      PRODUCTION_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN_PRODUCTION }}
    steps:
      - name: Require production role variable
        run: |
          test -n "$PRODUCTION_ROLE_ARN" || { echo "::error::Environment variable AWS_DEPLOY_ROLE_ARN_PRODUCTION is not set on the 'production' environment"; exit 1; }
      - *checkout
      - *setup-node
      - *install
      - name: Configure AWS credentials (OIDC, production role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PRODUCTION }}
          role-session-name: sst-foundation-deploy-production
          aws-region: ${{ inputs.aws-region }}
      - name: Deploy
        run: npx sst deploy --stage "$STAGE"
      - *read-url

  # Failing here means production is already changed: the run goes red (GitHub notifies on failed runs).
  smoke-production:
    needs: deploy-production
    runs-on: *runner
    permissions:
      contents: read
    env: *smoke-env
    steps:
      - *checkout
      - *setup-node
      - *install
      - name: Smoke check
        env:
          SMOKE_URL: ${{ needs.deploy-production.outputs.url }}
        run: |
          if [ -z "$SMOKE_URL" ]; then echo "No smoke URL configured; skipping"; exit 0; fi
          code=$(curl -sS -o body.json -w '%{http_code}' --retry 5 --retry-delay 3 --retry-all-errors "$SMOKE_URL")
          echo "HTTP $code"
          test "$code" = "200"
          if [ -n "$SMOKE_EXPECT_JQ" ]; then jq -e "$SMOKE_EXPECT_JQ" body.json > /dev/null; fi
      - name: Smoke command
        env:
          SMOKE_URL: ${{ needs.deploy-production.outputs.url }}
          SMOKE_STAGE: ${{ inputs.production-stage }}
        run: |
          if [ -z "$SMOKE_COMMAND" ]; then exit 0; fi
          bash -c "$SMOKE_COMMAND"
