# Default CI/CD for sst-foundation apps. Call it from the app's own workflow, pinned to a sst-foundation tag:
#
#   jobs:
#     ci:
#       uses: 15davidallison/sst-foundation/.github/workflows/app-ci.yml@v0.4.0
#       permissions: { contents: read, id-token: write, pull-requests: write }   # id-token: OIDC deploy; pull-requests: preview comment (required even without previews)
#       with:
#         deploy-stage: staging
#         role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
#         production-stage: production   # optional: adds the production steps below
#
# Pipeline on push to main:  checks -> deploy (deploy-stage) -> smoke -> deploy-production -> smoke-production
# A failed smoke job stops the run, so production is never attempted. Without `production-stage` only the first
# three jobs run. Pull requests run `checks` only. AWS access is GitHub OIDC only; no stored keys.
#
# Roles: `deploy` uses `role-arn` (non-prod role; its job declares no GitHub environment, so its OIDC subject is
# the main-branch one). `deploy-production` declares `environment: production`, so its subject is
# `...:environment:production`, and it reads the role from the environment variable
# AWS_DEPLOY_ROLE_ARN_PRODUCTION (environment variables are visible only to a job that names the environment,
# so the caller cannot pass it in). Smoke jobs get no AWS credentials at all.
# Customize by: (1) inputs below, (2) adding your own jobs next to the `ci` job (use `needs: ci`), or (3) writing
# your own workflow from the same building blocks (composite actions in .github/actions/, see docs/usage.md).
#
# Blocks are referenced with `$/`, which resolves against this workflow's own repository at the running commit
# (not the caller's checkout), so a caller pinned to a tag runs that tag's blocks.
name: app-ci

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      sst-install:
        description: Run `npx sst install` before checks (needed when sst.config.ts exists)
        type: boolean
        default: true
      lint-command:
        type: string
        default: npm run lint
      typecheck-command:
        type: string
        default: npm run typecheck
      test-command:
        description: Empty = skip tests
        type: string
        default: ""
      deploy-stage:
        description: Stage deployed on push to main (production, staging, ...)
        type: string
        required: true
      role-arn:
        description: OIDC deploy role to assume. Empty = checks only, no deploy.
        type: string
        default: ""
      aws-region:
        type: string
        default: us-west-2
      smoke-url-output:
        description: Key in .sst/outputs.json holding the URL to smoke check. Empty = skip.
        type: string
        default: url
      site-url-output:
        description: Key in .sst/outputs.json holding the app's public URL, recorded on the GitHub deployment (a console's live link). Empty = none.
        type: string
        default: url
      app-name:
        description: App name recorded on GitHub deployments (consoles group apps by it). Empty = repository name.
        type: string
        default: ""
      smoke-expect-jq:
        description: Optional jq expression the JSON response body must satisfy
        type: string
        default: ""
      smoke-command:
        description: Optional extra smoke test, run after the built-in URL check with SMOKE_URL and SMOKE_STAGE set (e.g. `npm run smoke`)
        type: string
        default: ""
      preview:
        description: Deploy a `pr-<n>` preview on pull requests (needs `role-arn`; the caller must grant pull-requests write for the comment)
        type: boolean
        default: false
      preview-branch-prefix:
        description: Only PRs whose head branch starts with this get a preview (so ordinary PRs do not). Empty = every PR.
        type: string
        default: "preview/"
      preview-base-stage:
        description: Stage whose secret values previews inherit (copied on every preview deploy). Must not be production.
        type: string
        default: staging
      preview-comment:
        description: Post/update one comment with the preview URL on the PR
        type: boolean
        default: true
      production-stage:
        description: Stage deployed after staging passes its smoke tests (normally `production`). Empty = no production job.
        type: string
        default: ""
    secrets:
      nonprod-token:
        description: Token for the CloudFront non-prod gate (sst-foundation nonprodGateInjection). Sent as x-nonprod-token by non-production smoke checks only.
        required: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: &runner ubuntu-24.04 # pinned: ubuntu-latest moves; bump deliberately
    steps:
      - uses: $/.github/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
          sst-install: ${{ inputs.sst-install }}
          stage: ${{ inputs.deploy-stage }}
      - name: Lint
        run: ${{ inputs.lint-command }}
      - name: Typecheck
        run: ${{ inputs.typecheck-command }}
      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.role-arn != ''
    runs-on: *runner
    permissions:
      id-token: write # request the OIDC token
      contents: read
      deployments: write # deployment record (version, URL, account) for consoles
    concurrency:
      group: deploy-${{ inputs.deploy-stage }}
      cancel-in-progress: false # never interrupt a deploy half-way
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - &setup
        uses: $/.github/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
      - uses: $/.github/actions/aws-login
        with:
          role-arn: ${{ inputs.role-arn }}
          session-name: sst-foundation-deploy
          region: ${{ inputs.aws-region }}
      # Start record (in_progress) right away, so consoles show the deploy while it runs; the outcome is posted to it.
      - id: record-start
        uses: $/.github/actions/record-start
        with:
          app-name: ${{ inputs.app-name || github.event.repository.name }}
          stage: ${{ inputs.deploy-stage }}
          region: ${{ inputs.aws-region }}
          sha: ${{ github.sha }}
      - id: deploy
        uses: $/.github/actions/sst-deploy
        with:
          stage: ${{ inputs.deploy-stage }}
          url-output: ${{ inputs.smoke-url-output }}
          site-url-output: ${{ inputs.site-url-output }}
      # Bookkeeping only: if GitHub's API fails the step warns and the release carries on.
      - if: always() && steps.deploy.outcome != 'skipped' && steps.deploy.outcome != ''
        uses: $/.github/actions/record-outcome
        with:
          app-name: ${{ inputs.app-name || github.event.repository.name }}
          stage: ${{ inputs.deploy-stage }}
          region: ${{ inputs.aws-region }}
          sha: ${{ github.sha }}
          outcome: ${{ steps.deploy.outcome }}
          deployment-id: ${{ steps.record-start.outputs.id }}
          site-url-output: ${{ inputs.site-url-output }}

  # Preview: PRs whose branch starts with `preview-branch-prefix` (default `preview/`) only. Never for Dependabot PRs (by PR author, not actor) or fork PRs. The OIDC subject is
  # `...:pull_request`, which the non-prod role trusts. Removal is preview-cleanup.yml.
  preview:
    needs: checks
    if: >-
      github.event_name == 'pull_request' && inputs.preview && inputs.role-arn != ''
      && startsWith(github.event.pull_request.head.ref, inputs.preview-branch-prefix)
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: *runner
    permissions:
      id-token: write
      contents: read
      deployments: write # deployment record (version, URL, account) for consoles
    concurrency:
      group: deploy-pr-${{ github.event.number }}
      cancel-in-progress: true # a newer push supersedes; an interrupted preview is disposable
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      site: ${{ steps.deploy.outputs.site }}
    env:
      STAGE: pr-${{ github.event.number }}
      BASE_STAGE: ${{ inputs.preview-base-stage }}
      PRODUCTION_STAGE: ${{ inputs.production-stage }}
    steps:
      - *setup
      - uses: $/.github/actions/aws-login
        with:
          role-arn: ${{ inputs.role-arn }}
          session-name: sst-foundation-preview
          region: ${{ inputs.aws-region }}
      - id: record-start
        uses: $/.github/actions/record-start
        with:
          app-name: ${{ inputs.app-name || github.event.repository.name }}
          stage: pr-${{ github.event.number }}
          region: ${{ inputs.aws-region }}
          sha: ${{ github.event.pull_request.head.sha }}
      # Previews inherit the base stage's (normally staging) secret values; no per-preview secrets to set.
      # Never prints a value; a multi-line value stops the copy (store it on one line). A secret missing on the base
      # stage is reported by the deploy.
      - name: Copy base-stage secrets to preview
        uses: $/.github/actions/copy-secrets
        with:
          from: ${{ inputs.preview-base-stage }}
          to: pr-${{ github.event.number }}
          production-stage: ${{ inputs.production-stage }}
      - id: deploy
        uses: $/.github/actions/sst-deploy
        with:
          stage: pr-${{ github.event.number }}
          url-output: ${{ inputs.smoke-url-output }}
          site-url-output: ${{ inputs.site-url-output }}
          secrets-from: ${{ inputs.preview-base-stage }}
      # Also when a step between the record and the deploy failed (the secret copy): the deploy never ran, so the
      # record gets `failure`. Before v0.8.0 it stayed in_progress forever ("Coming online" in consoles).
      - if: always() && (steps.record-start.outputs.id != '' || (steps.deploy.outcome != 'skipped' && steps.deploy.outcome != ''))
        uses: $/.github/actions/record-outcome
        with:
          app-name: ${{ inputs.app-name || github.event.repository.name }}
          stage: pr-${{ github.event.number }}
          region: ${{ inputs.aws-region }}
          sha: ${{ github.event.pull_request.head.sha }}
          outcome: ${{ (steps.deploy.outcome == '' || steps.deploy.outcome == 'skipped') && 'failure' || steps.deploy.outcome }}
          deployment-id: ${{ steps.record-start.outputs.id }}
          site-url-output: ${{ inputs.site-url-output }}

  smoke-preview:
    needs: preview
    runs-on: *runner
    permissions:
      contents: read
      pull-requests: write # sticky preview comment (skipped when preview-comment is false)
    steps:
      - *setup
      - uses: $/.github/actions/smoke
        with:
          url: ${{ needs.preview.outputs.url }}
          stage: pr-${{ github.event.number }}
          expect-jq: ${{ inputs.smoke-expect-jq }}
          command: ${{ inputs.smoke-command }}
          nonprod-token: ${{ secrets.nonprod-token }}
      - name: Comment preview URL
        if: always() && inputs.preview-comment && (needs.preview.outputs.site != '' || needs.preview.outputs.url != '')
        env:
          GH_TOKEN: ${{ github.token }}
          # The site's home page (site-url-output), not the smoke check's URL (often a health endpoint).
          URL: ${{ needs.preview.outputs.site || needs.preview.outputs.url }}
          PR: ${{ github.event.number }}
          SMOKE: ${{ job.status }}
        run: |
          marker='<!-- sst-foundation-preview -->'
          body="$marker"$'\n'"Preview \`pr-$PR\`: $URL"$'\n'"Smoke: $SMOKE. Removed automatically about 24 hours after the last push, or when the PR closes."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null; fi

  # Runs with no AWS credentials. Always runs after a deploy (steps skip inside), so `needs` below never
  # sees a skipped job.
  smoke:
    needs: deploy
    runs-on: *runner
    permissions:
      contents: read
    steps:
      - *setup
      - uses: $/.github/actions/smoke
        with:
          url: ${{ needs.deploy.outputs.url }}
          stage: ${{ inputs.deploy-stage }}
          expect-jq: ${{ inputs.smoke-expect-jq }}
          command: ${{ inputs.smoke-command }}
          nonprod-token: ${{ secrets.nonprod-token }}

  deploy-production:
    needs: [deploy, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.production-stage != ''
    runs-on: *runner
    environment:
      name: production # the production role's trust accepts only this environment; deployment branches = main
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      id-token: write
      contents: read
      deployments: write # deployment record (version, URL, account) for consoles
    concurrency:
      group: deploy-${{ inputs.production-stage }}
      cancel-in-progress: false
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      outcome: ${{ steps.deploy.outcome }}
      record-id: ${{ steps.record-start.outputs.id }}
      account: ${{ steps.facts.outputs.account }}
      site: ${{ steps.deploy.outputs.site }}
    env:
      PRODUCTION_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN_PRODUCTION }}
    steps:
      - name: Require production role variable
        run: |
          test -n "$PRODUCTION_ROLE_ARN" || { echo "::error::Environment variable AWS_DEPLOY_ROLE_ARN_PRODUCTION is not set on the 'production' environment"; exit 1; }
      - *setup
      - uses: $/.github/actions/aws-login
        with:
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PRODUCTION }}
          session-name: sst-foundation-deploy-production
          region: ${{ inputs.aws-region }}
      - id: record-start
        uses: $/.github/actions/record-start
        with:
          app-name: ${{ inputs.app-name || github.event.repository.name }}
          stage: ${{ inputs.production-stage }}
          region: ${{ inputs.aws-region }}
          sha: ${{ github.sha }}
      - id: deploy
        uses: $/.github/actions/sst-deploy
        with:
          stage: ${{ inputs.production-stage }}
          url-output: ${{ inputs.smoke-url-output }}
          site-url-output: ${{ inputs.site-url-output }}
      # Production's job declares `environment:`, so GitHub keeps its own deployment for it and marks it finished when the
      # job ends, which retires every older deployment of the environment, including one recorded here. So this job only
      # collects the facts, and record-production (a later job) records the deployment.
      - name: Collect deployment facts
        id: facts
        if: always() && steps.deploy.outcome != 'skipped' && steps.deploy.outcome != ''
        run: echo "account=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

  # Failing here means production is already changed: the run goes red (GitHub notifies on failed runs).
  record-production:
    needs: deploy-production
    if: always() && needs.deploy-production.result != 'skipped' && needs.deploy-production.outputs.outcome != ''
    runs-on: *runner
    permissions:
      deployments: write
    steps:
      - uses: $/.github/actions/record-outcome
        with:
          outcome: ${{ needs.deploy-production.outputs.outcome }}
          deployment-id: ${{ needs.deploy-production.outputs.record-id }}
          app-name: ${{ inputs.app-name || github.event.repository.name }}
          stage: ${{ inputs.production-stage }}
          region: ${{ inputs.aws-region }}
          sha: ${{ github.sha }}
          account: ${{ needs.deploy-production.outputs.account }}
          site: ${{ needs.deploy-production.outputs.site }}

  smoke-production:
    needs: deploy-production
    runs-on: *runner
    permissions:
      contents: read
    steps:
      - *setup
      - uses: $/.github/actions/smoke
        with:
          url: ${{ needs.deploy-production.outputs.url }}
          stage: ${{ inputs.production-stage }}
          expect-jq: ${{ inputs.smoke-expect-jq }}
          command: ${{ inputs.smoke-command }}
