# sst-foundation's own checks, run through the same reusable workflow apps use. Action pins and the runner
# live only in app-ci.yml, so bumping an action is a one-line edit there.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/app-ci.yml
    permissions:
      contents: read
      id-token: write # required by the called workflow's deploy job, even though it is skipped here
      pull-requests: write # required by the called workflow's preview comment step, even though previews are off here
      deployments: write # required by the called workflow's deployment records (v0.5.0), even though nothing deploys here
    with:
      deploy-stage: none # unused: no role-arn, so no deploy job runs
      sst-install: false # sst-foundation has no SST app
      test-command: npm test
