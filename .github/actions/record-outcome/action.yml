name: sst-foundation record-outcome
description: >-
  Post the outcome of a deploy or operation to its GitHub deployment record (from record-start; a new record is created
  if that failed). success -> success (inactive for a teardown), anything else -> failure. Reads the account with the
  job's AWS credentials and the site URL from .sst/outputs.json unless they are passed in (as the production record
  job does, which has neither). Bookkeeping: a failure warns and the run carries on. The job needs `deployments: write`.
inputs:
  outcome:
    description: The deploy step's outcome (success | failure | cancelled)
    required: true
  deployment-id:
    default: ""
  action:
    default: deploy
  app-name:
    required: true
  stage:
    required: true
  region:
    required: true
  sha:
    required: true
  site-url-output:
    description: Key in .sst/outputs.json with the site URL. Empty = none.
    default: ""
  account:
    description: Account id, when this job has no AWS credentials
    default: ""
  site:
    description: Site URL, when this job has no .sst/outputs.json
    default: ""
  token:
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.token }}
        OUTCOME: ${{ inputs.outcome }}
        DEPLOYMENT_ID: ${{ inputs.deployment-id }}
        ACTION: ${{ inputs.action }}
        APP_NAME: ${{ inputs.app-name }}
        STAGE: ${{ inputs.stage }}
        REGION: ${{ inputs.region }}
        SHA: ${{ inputs.sha }}
        SITE_URL_OUTPUT: ${{ inputs.site-url-output }}
        ACCOUNT: ${{ inputs.account }}
        SITE: ${{ inputs.site }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        account=${ACCOUNT:-$(aws sts get-caller-identity --query Account --output text 2>/dev/null || true)}
        site=${SITE:-}
        if [ -z "$site" ] && [ -n "$SITE_URL_OUTPUT" ] && [ -f .sst/outputs.json ]; then site=$(jq -r --arg k "$SITE_URL_OUTPUT" '.[$k] // empty' .sst/outputs.json); fi
        action=${ACTION:-deploy}
        # Final state: a finished teardown is `inactive` (consoles read the record's action, not the state alone).
        state=failure
        if [ "$OUTCOME" = success ]; then state=success; [ "$action" = teardown ] && state=inactive; fi
        id=${DEPLOYMENT_ID:-}
        if [ -z "$id" ]; then
          # The start record couldn't be made; record the outcome as a new deployment instead.
          id=$(jq -nc --arg ref "$SHA" --arg env "$STAGE" --arg app "$APP_NAME" --arg account "$account" --arg region "$REGION" --arg action "$action" '{
              ref: $ref, environment: $env, auto_merge: false, required_contexts: [], description: ("sst-foundation " + $action),
              transient_environment: ($env | startswith("pr-")), production_environment: ($env == "production"),
              payload: { sstFoundation: 1, app: $app, stage: $env, account: $account, region: $region, action: $action } }' \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
        fi
        jq -nc --arg s "$state" --arg url "$site" --arg log "$RUN_URL" \
          '{ state: $s, log_url: $log, auto_inactive: ($s == "success") } + (if $url == "" or $s == "inactive" then {} else { environment_url: $url } end)' \
          | gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --input - > /dev/null
        echo "Recorded deployment $id: $APP_NAME $STAGE @ ${SHA:0:7} ($action: $state)"
